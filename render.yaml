databases:
  - name: secure-code-factory-db
    plan: free
    databaseName: secure_code_factory
    user: secure_code_factory

services:
  - type: web
    name: secure-code-factory-dashboard
    runtime: python
    plan: free
    branch: feature/add-django-implementation
    buildCommand: ./build.sh
    startCommand: gunicorn securefactory.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: secure-code-factory-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
